<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Day Planer</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Day Planer">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#F3F2F8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: phone-first, soft lavender ground with floating white cards; the current task is a violet "player" card, status sits in pastel bubbles and tiles, the bottom bar carries a centre plus. */
:root{
  --bg:#F3F2F8;--card:#FFFFFF;--soft:#F5F4FA;--ink:#1D1A2C;--ink-2:#6C6882;--ink-3:#A29EB5;--line:#EBE9F2;
  --violet:#6A2EE8;--violet-2:#9A6BFF;--violet-soft:#EEE8FE;--violet-t:#5A22D4;
  --coral:#E8573F;--coral-soft:#FDE7E2;--coral-t:#C23F2A;
  --sky:#2E8FE0;--sky-soft:#E0F0FD;--sky-t:#1B73BD;
  --mint:#20A866;--mint-soft:#DCF3E7;--mint-t:#14824C;
  --peach:#EE8F3A;--peach-soft:#FDEEDC;--peach-t:#B3601A;
  --sun:#FFC43D;
  --on-c:#FFFFFF;--glass:rgba(255,255,255,.2);--glass-2:rgba(255,255,255,.32);--knob:#FFFFFF;--sw-off:#E2E0EA;
  --deep-v:#5A22D4;--deep-c:#B83A26;--deep-s:#16649F;
  --nb-bg:rgba(255,255,255,.95);--scrim:rgba(20,14,40,.42);
  --sh:0 1px 2px rgba(42,28,100,.05),0 14px 30px -18px rgba(42,28,100,.3);
  --sh-v:0 18px 34px -18px rgba(106,46,232,.75);
  --sh-c:0 18px 34px -18px rgba(232,87,63,.7);
  --sh-s:0 18px 34px -18px rgba(46,143,224,.7);
  --f:"Outfit","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --nav:70px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0D16;--card:#1A1724;--soft:#221F2E;--ink:#EEEBF7;--ink-2:#A9A4BE;--ink-3:#716C88;--line:#2A2638;
    --violet:#7646FF;--violet-2:#A07BFF;--violet-soft:#2A2147;--violet-t:#B9A1FF;
    --coral:#E5604A;--coral-soft:#3A2320;--coral-t:#FF9F8E;
    --sky:#2F8DDA;--sky-soft:#13283B;--sky-t:#82C4FF;
    --mint:#27B572;--mint-soft:#142D21;--mint-t:#71DBA8;
    --peach:#EE9A4E;--peach-soft:#35271A;--peach-t:#FFBF86;
    --sw-off:#3A3650;--nb-bg:rgba(34,31,46,.97);--scrim:rgba(0,0,0,.6);
    --sh:0 16px 32px -20px rgba(0,0,0,.85);--sh-v:0 18px 34px -20px rgba(118,70,255,.6);--sh-c:0 18px 34px -20px rgba(229,96,74,.55);--sh-s:0 18px 34px -20px rgba(47,141,218,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0D16;--card:#1A1724;--soft:#221F2E;--ink:#EEEBF7;--ink-2:#A9A4BE;--ink-3:#716C88;--line:#2A2638;
  --violet:#7646FF;--violet-2:#A07BFF;--violet-soft:#2A2147;--violet-t:#B9A1FF;
  --coral:#E5604A;--coral-soft:#3A2320;--coral-t:#FF9F8E;
  --sky:#2F8DDA;--sky-soft:#13283B;--sky-t:#82C4FF;
  --mint:#27B572;--mint-soft:#142D21;--mint-t:#71DBA8;
  --peach:#EE9A4E;--peach-soft:#35271A;--peach-t:#FFBF86;
  --sw-off:#3A3650;--nb-bg:rgba(34,31,46,.97);--scrim:rgba(0,0,0,.6);
  --sh:0 16px 32px -20px rgba(0,0,0,.85);--sh-v:0 18px 34px -20px rgba(118,70,255,.6);--sh-c:0 18px 34px -20px rgba(229,96,74,.55);--sh-s:0 18px 34px -20px rgba(47,141,218,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--violet-2);outline-offset:2px}
.c-violet{background:var(--violet-soft);color:var(--violet-t)}
.c-coral{background:var(--coral-soft);color:var(--coral-t)}
.c-sky{background:var(--sky-soft);color:var(--sky-t)}
.c-mint{background:var(--mint-soft);color:var(--mint-t)}
.c-peach{background:var(--peach-soft);color:var(--peach-t)}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(var(--nav) + 44px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:24px}

/* header: clock + bell, like the weather row in the reference */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.clock{display:flex;align-items:center;gap:10px;min-width:0}
.clock svg{flex:0 0 auto;width:40px;height:32px}
.clock b{display:block;font-size:18px;font-weight:600;line-height:1.1}
.clock span{display:block;font-size:12.5px;color:var(--ink-3)}
.bell{position:relative;flex:0 0 auto;display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:50%;background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.bell svg{width:22px;height:22px}
.bell-dot{position:absolute;top:9px;right:10px;width:11px;height:11px;border-radius:50%;border:2px solid var(--card);background:var(--mint)}
.bell-dot.wait{background:var(--coral)}
.note{padding:12px 14px;border-radius:16px;background:var(--peach-soft);color:var(--peach-t);font-size:14px;font-weight:500}
.strip{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:16px;background:var(--peach-soft);color:var(--ink);text-align:left}
.strip span{flex:1 1 auto;min-width:0;font-size:14px;font-weight:500}
.strip b{flex:0 0 auto;font-size:13.5px;font-weight:600;color:var(--peach-t)}

/* titles */
.ttl{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;gap:8px}
.ttl-c{min-width:0;text-align:center}
.ttl h1{font-size:27px;font-weight:600;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.ttl p{margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.rb{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:15px;background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.rb svg{width:20px;height:20px}
.rb.v{background:var(--violet);color:var(--on-c);box-shadow:var(--sh-v)}
.datepill{display:flex;align-items:center;justify-content:center;gap:6px}
.datepill span{min-width:0;font-size:14px;font-weight:500;color:var(--ink-2)}
.dp-b{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.dp-b svg{width:16px;height:16px}
.dp-b:disabled{opacity:.35;cursor:default}

/* sections */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-t{font-size:18px;font-weight:600}
.sec-t.sm{font-size:16px}
.see{border:0;background:none;padding:4px 0;font-size:13.5px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.see.v{color:var(--violet-t)}
.warn-t{font-size:13px;font-weight:600;color:var(--coral-t)}
.empty{padding:16px;border-radius:18px;background:var(--card);box-shadow:var(--sh);color:var(--ink-2);font-size:14px}
.hint{font-size:13px;color:var(--ink-3)}
.sp{flex:1 1 auto}

/* status bubbles */
.bubs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bub{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:2px 0;border:0;background:none}
.bub-ic{display:grid;place-items:center;width:58px;height:58px;border-radius:50%}
.bub-ic svg{width:24px;height:24px}
.bub b{font-size:13.5px;font-weight:500;line-height:1.2}
.bub small{font-size:12.5px;color:var(--ink-3)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:8px 0 7px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--sh)}
.wd-n{font-size:11.5px;font-weight:500;color:var(--ink-3)}
.wd-d{font-size:19px;font-weight:600;line-height:1.15}
.wd i{width:5px;height:5px;border-radius:50%;background:var(--violet)}
.wd i.off{visibility:hidden}
.wd.sel{background:var(--violet);color:var(--on-c);box-shadow:var(--sh-v)}
.wd.sel .wd-n{color:var(--on-c)}
.wd.sel i{background:var(--on-c)}

/* the player card */
.player{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:26px;background:var(--violet);color:var(--on-c);box-shadow:var(--sh-v)}
.player.coral{background:var(--coral);box-shadow:var(--sh-c)}
.player.sky{background:var(--sky);box-shadow:var(--sh-s)}
.player :focus-visible{outline-color:var(--on-c)}
.pl-top{display:flex;align-items:center;gap:12px}
.pl-ic{flex:0 0 auto;display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--glass)}
.pl-ic svg{width:21px;height:21px}
.pl-h{flex:1 1 auto;min-width:0}
.pl-h b{display:block;font-size:15px;font-weight:600}
.pl-h small{display:block;font-size:13px}
.pl-n{flex:0 0 auto;padding:4px 10px;border-radius:999px;background:var(--glass);font-size:12.5px;font-weight:600}
.pl-title{font-size:23px;font-weight:600;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.pl-info{display:flex;flex-wrap:wrap;gap:6px}
.pl-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--glass);font-size:13px;font-weight:500}
.pl-chip svg{width:14px;height:14px}
.pl-ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pl-btns{display:flex;align-items:center;gap:4px}
.pc{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit}
.pc svg{width:20px;height:20px}
.pc.big{width:58px;height:58px;border:2px solid var(--on-c)}
.pc.big svg{width:22px;height:22px}
.pc:disabled{opacity:.35;cursor:default}
.pl-done{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:8px 18px;border:0;border-radius:999px;background:var(--on-c);color:var(--deep-v);font-weight:600;font-size:15px}
.pl-done svg{width:17px;height:17px}
.player.coral .pl-done{color:var(--deep-c)}
.player.sky .pl-done{color:var(--deep-s)}

/* quick actions (scenes) */
.scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scene{display:flex;align-items:center;gap:12px;min-width:0;min-height:66px;padding:12px 14px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--sh);text-align:left}
.scene-ic{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;border-radius:13px}
.scene-ic svg{width:21px;height:21px}
.scene-t{min-width:0}
.scene-t b{display:block;font-size:15px;font-weight:500;line-height:1.2}
.scene-t small{display:block;font-size:13px;color:var(--ink-3)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tiles>:last-child:nth-child(odd){grid-column:1/-1}
.tile{display:flex;flex-direction:column;gap:10px;min-width:0;padding:14px;border-radius:20px;background:var(--card);box-shadow:var(--sh)}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.t-ic{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-size:16px;font-weight:600}
.t-ic svg{width:19px;height:19px}
.tile-t{display:block;width:100%;padding:0;border:0;background:none;text-align:left;font-size:15.5px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.tile-s{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.tile-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.tile.run{background:var(--violet);color:var(--on-c);box-shadow:var(--sh-v)}
.tile.run .tile-s{color:var(--on-c)}
.tile.run .t-ic{background:var(--glass);color:var(--on-c)}
.tile.done .tile-t{color:var(--ink-3);text-decoration:line-through}
.slot{align-items:flex-start;border:2px dashed var(--line);background:transparent;box-shadow:none;text-align:left;color:var(--ink-2)}
.slot b{font-size:15px;font-weight:500;color:var(--ink)}
.mini{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;padding:0;border:0;border-radius:50%;background:var(--violet-soft);color:var(--violet-t)}
.mini svg{width:16px;height:16px}
.tile.run .mini{background:var(--on-c);color:var(--deep-v)}
.live{font-weight:600;font-size:14px}

/* switch */
.sw{position:relative;flex:0 0 auto;width:48px;height:28px;padding:0;border:0;border-radius:14px;background:var(--sw-off);transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(20,10,50,.3);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--violet)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.tile.run .sw{background:var(--glass-2)}

/* chips */
.rc{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--violet-soft);color:var(--violet-t);font-size:12px;font-weight:500;white-space:nowrap}
.rc svg{width:12px;height:12px}
.tile.run .rc{background:var(--glass);color:var(--on-c)}
.ph{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%}
.ph svg{width:12px;height:12px}
.ph.ok{background:var(--mint-soft);color:var(--mint-t)}
.ph.wait{background:var(--peach-soft);color:var(--peach-t)}
.tile.run .ph{background:var(--on-c)}
.st{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--mint-soft);color:var(--mint-t)}
.st.bad{background:var(--coral-soft);color:var(--coral-t)}
.st.warn{background:var(--peach-soft);color:var(--peach-t)}
.tag{display:inline-block;margin-right:4px;padding:1px 7px;border-radius:6px;background:var(--coral-soft);color:var(--coral-t);font-size:11px;font-weight:600;vertical-align:1px}

/* lists */
.list{border-radius:20px;background:var(--card);box-shadow:var(--sh);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 14px}
.row-main{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding:2px 0;border:0;background:none;text-align:left}
.row-t{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.row-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.row-m .bad{color:var(--coral-t);font-weight:600}
.done .row-t{color:var(--ink-3);text-decoration:line-through}
.tl-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px}
.tl-time{font-size:17px;font-weight:600}
.tl-row.past .tl-time{color:var(--ink-3)}
.tl-now{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:10px;padding:4px 14px}
.tl-now span{font-size:12px;font-weight:600;color:var(--violet-t)}
.tl-now i{position:relative;height:2px;border-radius:1px;background:var(--violet)}
.tl-now i::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--violet)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:8px 18px;border:0;border-radius:14px;font-weight:600;font-size:15px;line-height:1.2;text-align:center}
.btn svg{width:16px;height:16px}
.btn.v{background:var(--violet);color:var(--on-c);box-shadow:var(--sh-v)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--violet-soft);color:var(--violet-t)}
.btn.bad{background:var(--coral-soft);color:var(--coral-t)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.lnk{padding:6px 0;border:0;background:none;font-size:14px;font-weight:600;color:var(--violet-t);white-space:nowrap}
.card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--card);box-shadow:var(--sh)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-t{font-size:17px;font-weight:600}
.card-l{display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:var(--ink-2)}
.card-l b{color:var(--ink);font-weight:600}
.card-b{display:flex;flex-wrap:wrap;gap:8px}

/* meetings */
.mcard{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;padding:12px;border-radius:22px;background:var(--card);box-shadow:var(--sh)}
.mc-time{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 4px;border-radius:16px;background:var(--soft);text-align:center}
.mc-time b{font-size:21px;font-weight:600;line-height:1.1}
.mc-time small{font-size:12px;font-weight:500}
.g-today .mc-time{background:var(--violet);color:var(--on-c)}
.g-tom .mc-time{background:var(--peach-soft);color:var(--peach-t)}
.g-later .mc-time{background:var(--sky-soft);color:var(--sky-t)}
.g-past .mc-time{color:var(--ink-2)}
.mc-b{display:flex;flex-direction:column;gap:5px;min-width:0;padding:4px 2px}
.mc-b h3{font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
.mc-l{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--ink-2)}
.mc-l svg{flex:0 0 auto;width:15px;height:15px}
.mc-n{padding:8px 10px;border-radius:12px;background:var(--soft);font-size:14px;overflow-wrap:anywhere}
.mc-f{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px}
.sel{-webkit-user-select:all;user-select:all;font-weight:600;color:var(--ink)}

/* orders */
.sumrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sumc{min-width:0;padding:14px 16px;border-radius:22px;color:var(--on-c)}
.sumc.v{background:var(--violet);box-shadow:var(--sh-v)}
.sumc.c{background:var(--coral);box-shadow:var(--sh-c)}
.sumc span{display:block;font-size:13px;font-weight:500}

document.addEventListener('keydown', unlockAudio);
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act, id = a.dataset.id, t = today();
  switch (act) {
    case 'tab': if (a.dataset.tab === 'bugun' && S.tab === 'bugun') S.day = t; if (a.dataset.tab === 'hisobot' && S.tab !== 'hisobot') S.rep = t; S.tab = a.dataset.tab; window.scrollTo(0, 0); draw(); break;
    case 'jump': { const el = document.getElementById(a.dataset.to); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'day': S.day = a.dataset.day; render(); break;
    case 'add': openSheet(a.dataset.kind || ({ uchrashuv: 'meeting', buyurtma: 'order', odatlar: 'habit' }[S.tab] || 'task'), { top: a.dataset.top === '1', date: a.dataset.date || (S.tab === 'bugun' ? S.day : null) }); break;
    case 'inbox': openSheet('inbox'); break;
    case 'edit-task': openSheet('task', { id }); break;
    case 'edit-meeting': openSheet('meeting', { id }); break;
    case 'edit-order': openSheet('order', { id }); break;
    case 'edit-habit': openSheet('habit', { id }); break;
    case 'toggle-task': { const x = findTask(id); if (x) { setDone(id, !x.done); if (!x.done) toast('Bajarildi'); } break; }
    case 'task-start': startTask(id); break;
    case 'task-stop': stopTask(id); break;
    case 'task-done': setDone(id, true); toast('Bajarildi'); break;
    case 'focus-skip': S.skip.push(a.dataset.k); render(); break;
    case 'focus-prev': S.skip.pop(); render(); break;
    case 'focus-reset': S.skip = []; render(); break;
    case 'move-today': patchTask(id, { date: t }); toast('Bugunga o‘tkazildi'); break;
    case 'move-all': { const L = tasks().filter(x => !x.done && x.date < t); L.forEach(x => patchTask(x.id, { date: t })); toast(L.length + ' ta ish bugunga o‘tkazildi'); break; }
    case 'carry': { const tm = addDays(t, 1), L = tasks().filter(x => x.date === t && !x.done); L.forEach(x => patchTask(x.id, { date: tm, spentMs: spentOf(x), startedAt: null })); toast(L.length + ' ta ish ertaga o‘tkazildi'); break; }
    case 'plan-tomorrow': S.tab = 'bugun'; S.day = addDays(t, 1); window.scrollTo(0, 0); draw(); break;
    case 'wake': { const hm = nowHM(); setDay(t, { wake: hm }); toast('Uyg‘ongan vaqt: ' + hm); break; }
    case 'wake-info': toast('Bugun ' + ((S.days.get(t) || {}).wake || '') + ' da uyg‘ondingiz'); break;
    case 'meet-st': setMeet(id, a.dataset.s); break;
    case 'order-next': nextStage(id); break;
    case 'of': S.of = a.dataset.f; render(); break;
    case 'hf': S.hf = a.dataset.f; render(); break;
    case 'hab-cell': cycleHabit(id, a.dataset.date); break;
    case 'hab-today': setHabit(id, t, 1); break;
    case 'hab-restart': restartHabit(id); if (SH) closeSheet(); break;
    case 'rep': S.rep = addDays(S.rep, Number(a.dataset.v)); render(); break;
    case 'rate': { const d = S.rep, cur = (S.days.get(d) || {}).rate || 0, v = Number(a.dataset.v); setDay(d, { rate: cur === v ? 0 : v }); break; }
    case 'copy': copy(a.dataset.text || ''); break;
    case 'sound': soundOn = !soundOn; LS.set('dp-sound', soundOn); a.setAttribute('aria-checked', String(soundOn)); if (soundOn) { unlockAudio(); ding(); } break;
    case 'test-nb': {
      unlockAudio();
      const up = inappEvents().find(ev => ev.t > Date.now());
      const item = { key: 'test:' + Date.now(), kind: 'test', k: 'test', n: 10, t: Date.now(), text: up ? up.text : 'Jamshid aka shkaflari raskroyiga 10 daqiqa qoldi' };
      closeSheet(); showBanner(item, false); setTimeout(ding, 30); break;
    }
    case 'nb-close': { const nb = a.closest('.nb'); if (nb) nb.remove(); break; }
    case 'nb-done': {
      const it = NB.get(a.dataset.key), nb = a.closest('.nb'); if (nb) nb.remove();
      if (it && it.kind === 'task') { setDone(it.id, true); toast('Bajarildi'); }
      else if (it && it.kind === 'meeting') setMeet(it.id, 'done');
      break;
    }
    case 'nb-snooze': {
      const it = NB.get(a.dataset.key), nb = a.closest('.nb'); if (nb) nb.remove();
      if (it) { const tt = Date.now() + 5 * 60000; SNZ.push({ key: it.key.split(':z')[0] + ':z' + tt, kind: it.kind, id: it.id, k: 'z', n: 0, t: tt, text: it.text }); saveLocal(); toast('5 daqiqadan keyin yana eslatadi'); }
      break;
    }
    case 'sheet-close': closeSheet(); break;
    case 'sheet-kind': SH.kind = a.dataset.k; SH.id = null; drawSheet(); { const f = $('#sheet [data-auto]'); if (f) f.focus(); } break;
    case 'flip': a.setAttribute('aria-checked', String(a.getAttribute('aria-checked') !== 'true')); break;
    case 'pick-date': { const inp = $('#' + a.dataset.for); if (inp) { inp.value = a.dataset.v; syncChips(inp); drawPrev(); } break; }
    case 'pick': {
      const g = a.dataset.g, hid = $('#f-' + g), on = a.getAttribute('aria-pressed') === 'true';
      const v = on && a.dataset.toggle ? '' : a.dataset.v;
      if (hid) hid.value = v;
      $$(`#sheet [data-g="${g}"]`).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === v)));
      break;
    }
    case 'rem-dec': { const i = +a.dataset.i, v = SH.rem.before[i] || 10; SH.rem.before[i] = v <= 5 ? Math.max(1, v - 1) : v - 5; drawRem(`[data-act="rem-dec"][data-i="${i}"]`); break; }
    case 'rem-inc': { const i = +a.dataset.i, v = SH.rem.before[i] || 10; SH.rem.before[i] = Math.min(1440, v < 5 ? v + 1 : v + 5); drawRem(`[data-act="rem-inc"][data-i="${i}"]`); break; }
    case 'rem-del': SH.rem.before.splice(+a.dataset.i, 1); drawRem(); break;
    case 'rem-add': { const b = SH.rem.before, c = [60, 30, 15, 120, 5].find(v => !b.includes(v)) || 45; b.push(c); drawRem(`#f-rm${b.length - 1}`); break; }
    case 'rem-quick': { const v = +a.dataset.v; if (!SH.rem.before.length) SH.rem.before.push(v); else SH.rem.before[0] = v; drawRem(); break; }
    case 'rem-at': SH.rem.at = !SH.rem.at; drawRem('[data-act="rem-at"]'); break;
    case 'del-ask': $('#del-zone').innerHTML = `<div class="confirm"><span>Rostdan o‘chirilsinmi?</span><span class="sp"></span>${B('del-yes', 'Ha, o‘chirish', 'btn bad sm')}${B('del-no', 'Yo‘q', 'btn line sm')}</div>`; break;
    case 'del-no': $('#del-zone').innerHTML = ''; break;
    case 'del-yes': if (SH && SH.id) { remove(COLS[SH.kind], SH.id); closeSheet(); toast('O‘chirildi'); } break;
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'frm') { e.preventDefault(); if (SH) saveSheet(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.hasAttribute && el.hasAttribute('data-money')) { const n = parseMoney(el.value); el.value = n ? money(n) : ''; updRem(); }
  if (el.id === 'f-note') { clearTimeout(noteT); noteT = setTimeout(saveNote, 900); }
  if (!el.closest || !el.closest('#sheet') || !SH) return;
  if (el.hasAttribute('data-rm')) {
    const digits = el.value.replace(/\D/g, ''); if (digits !== el.value) el.value = digits;
    const n = parseInt(digits, 10);
    if (n > 0) { SH.rem.before[+el.dataset.rm] = Math.min(1440, n); drawPrev(); $$('#sheet [data-act="rem-quick"]').forEach(c => c.setAttribute('aria-pressed', String(+c.dataset.v === SH.rem.before[0]))); }
    return;
  }
  if (el.type === 'date') syncChips(el);
  if (el.id === 'f-time') { drawRem(); return; }
  if (['f-title', 'f-who', 'f-place', 'f-date'].includes(el.id)) drawPrev();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.closest || !el.closest('#sheet') || !SH) return;
  if (el.type === 'date') { syncChips(el); drawPrev(); }
  if (el.hasAttribute('data-rm')) { const i = +el.dataset.rm, n = parseInt(el.value, 10); if (!(n > 0)) el.value = SH.rem.before[i] || 10; else if (n > 1440) el.value = 1440; }
  if (el.id === 'f-time') drawRem();
});
document.addEventListener('focusout', e => {
  if (e.target.id === 'f-note') saveNote();
  if (pendingDraw) setTimeout(() => { if (pendingDraw) render(); }, 350);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SH) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkReminders(); render(); } });
setInterval(() => {
  $$('[data-tick]').forEach(el => { const x = findTask(el.dataset.tick); if (x && x.startedAt && !x.done) el.textContent = clock(spentOf(x)); });
}, 1000);
setInterval(() => { checkReminders(); drawClock(); }, 15000);
setInterval(render, 60000);

/* ---------- start ---------- */
async function init() {
  draw();
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const r = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('user').catch(() => null)]);
      db = r[0]; user = r[1];
    }
  } catch (e) { db = null; }
  if (!db) { S.mode = 'local'; loadLocal(); render(); checkReminders(); return; }
  DB = db; S.mode = 'db'; render();
  NEED.forEach(sub);
  if (user && typeof user.can === 'function') {
    try { if (await user.can('data.write') === false) { S.ro = true; render(); } } catch (e) {}
  }
}
init();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
})();
</script>
